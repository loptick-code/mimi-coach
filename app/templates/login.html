{% extends "base.html" %}
{% block title %}Connexion - Mimi Coach{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 text-white mb-4 shadow-md">
      <svg viewBox="0 0 24 24" class="w-7 h-7" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    </div>
    <h1 class="text-2xl font-extrabold tracking-tight">Mimi Coach</h1>
    <p class="text-stone-500 text-sm mt-1">Ton programme running, prêt à être exporté.</p>
  </div>

  <div class="card card-pad">
    {% if error %}
    <div class="mb-4 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm border border-rose-100">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="space-y-3">
      <div>
        <label for="login-email" class="field-label">Email</label>
        <input id="login-email" type="email" name="email" required autofocus autocomplete="email" class="input" />
      </div>
      <div>
        <label for="login-password" class="field-label">Mot de passe</label>
        <input id="login-password" type="password" name="password" required autocomplete="current-password" class="input" />
      </div>
      <button type="submit" class="btn btn-primary w-full mt-2">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
